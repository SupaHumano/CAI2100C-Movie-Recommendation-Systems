name: Assignment 8 one-time simple notebook validation
on:
  push:
    branches: [assignment8-two-tasks-simple-csv-20261027]
    paths: ['.github/workflows/assignment8-simple-onetime.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific packages
        run: python -m pip install -q numpy pandas scipy scikit-learn matplotlib nbformat nbclient ipykernel
      - name: Replace encoded data with readable CSV and two methods
        run: |
          python tools/simplify_assignment8.py notebooks/Assignment_8_Juan_Luna_Santibanez_Movie_Recommendation_Systems.ipynb notebooks/Assignment_8_Juan_Luna_Santibanez_Movie_Recommendation_Systems.ipynb
      - name: Execute twice in empty Jupyter sessions
        run: |
          python - <<'PY'
          import tempfile,nbformat
          from pathlib import Path
          from nbclient import NotebookClient
          p=Path('notebooks/Assignment_8_Juan_Luna_Santibanez_Movie_Recommendation_Systems.ipynb')
          for run in (1,2):
              nb=nbformat.read(p,as_version=4)
              nbformat.validate(nb)
              with tempfile.TemporaryDirectory() as td:
                  executed=NotebookClient(nb,timeout=240,kernel_name='python3',allow_errors=False,resources={'metadata':{'path':td}}).execute()
              codes=[c for c in executed.cells if c.cell_type=='code']
              assert len(codes)==7 and all(c.execution_count is not None for c in codes)
              assert not [o for c in codes for o in c.outputs if o.output_type=='error']
              assert len(executed.cells)==14
              src=''.join(c.source for c in executed.cells if c.cell_type=='code')
              assert 'hashlib' not in src and 'base64' not in src and 'gzip' not in src
              assert any(c.metadata.get('cellView')=='form' and '_IMDB_MOVIES_CSV' in c.source for c in codes)
              print('PASS real IMDb samples: 7/7 cells, run',run,flush=True)
              if run==1:
                  for c in executed.cells:
                      c.metadata.pop('execution',None)
                      c.metadata.pop('ExecuteTime',None)
                  nbformat.write(executed,p)
          print('Executed notebook size',p.stat().st_size,flush=True)
          PY
      - name: Commit only if complete execution succeeded
        run: |
          git config user.name "assignment8-validation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/Assignment_8_Juan_Luna_Santibanez_Movie_Recommendation_Systems.ipynb
          git commit -m "Assignment 8: two IMDb tasks, plain CSV data and saved results"
          git push origin HEAD:assignment8-two-tasks-simple-csv-20261027
