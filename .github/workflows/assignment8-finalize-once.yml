name: Assignment 8 final branch consolidation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/assignment8-finalize-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Delete merged development branch after verifying PR
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/6 --jq '.merged')" = "true"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/assignment8-final-match-assignment7-20261027"
      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "assignment8-consolidation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/assignment8-finalize-once.yml
          git commit -m "Finalize Assignment 8 student repository on main"
          git push origin HEAD:main
